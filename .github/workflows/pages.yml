name: pages-build-deployment

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Build the interactive badge
        run: |
          npm ci
          npm run check:badge
          npm run build:badge
          npm run check:work
          npm run build:work
          npm run check:certificates
      - name: Assemble the public site
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude=_site --exclude=.git --exclude=.github \
            --exclude=node_modules --exclude=src --exclude=scripts \
            --exclude=output --exclude=outputs --exclude=.playwright-mcp --exclude=.impeccable \
            --exclude=badge-physics-preview.html --exclude=design-directions-preview.html \
            --exclude=package.json --exclude=package-lock.json \
            --exclude=SCROLL_3D_PLAN.md --exclude=tsconfig.work.json --exclude=PORTFOLIO_REDESIGN_PLAN.md --exclude=DESIGN.md --exclude=tsconfig.badge.json --exclude=BADGE_3D_PLAN.md --exclude=RELEASE_PLAN.md
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
